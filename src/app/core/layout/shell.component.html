<a class="skip-link" href="#main-content">Skip to main content</a>
<mat-toolbar class="header" role="banner">
  @if (isMobile()) {
    <button mat-icon-button type="button" (click)="nav.toggle()" aria-label="Toggle navigation menu">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <mat-icon aria-hidden="true" class="logo">troubleshoot</mat-icon>
  <span class="title">Production Log Mining Portal</span>
</mat-toolbar>
<div class="progress" aria-hidden="true">
  @if (loading.isLoading()) { <mat-progress-bar mode="indeterminate" /> }
</div>

<mat-sidenav-container class="container">
  <mat-sidenav #nav [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile()" [fixedInViewport]="isMobile()" fixedTopGap="64">
    <nav aria-label="Primary">
      <mat-nav-list>
        @for (item of items; track item.path) {
          <a mat-list-item [routerLink]="item.path" routerLinkActive="active" #rla="routerLinkActive"
             [attr.aria-current]="rla.isActive ? 'page' : null" (click)="isMobile() && nav.close()">
            <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <main id="main-content" tabindex="-1" class="content"><router-outlet /></main>
  </mat-sidenav-content>
</mat-sidenav-container>
