<mat-card appearance="outlined" [class]="'kpi tone-' + tone()">
  <div class="top">
    <span class="label">{{ label() }}</span>
    <span class="ico" aria-hidden="true"><mat-icon>{{ icon() }}</mat-icon></span>
  </div>
  <div class="value">{{ value() }}</div>
  <div class="foot">
    @if (trend(); as t) {
      <span [class]="'delta ' + t.tone">@if (arrow()) { <mat-icon aria-hidden="true">{{ arrow() }}</mat-icon> }{{ t.label }}</span>
    }
    @if (hint()) { <span class="hint">{{ hint() }}</span> }
  </div>
</mat-card>
